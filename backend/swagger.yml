openapi: 3.1.0

info:
  title: Recipe API
  version: 1.0.0

paths:
  /recipes:
    get:
      summary: Find and explain the closest available recipe
      parameters:
        - name: query
          in: query
          required: true
          description: Comma-separated ingredient names
          schema:
            type: string
      responses:
        '200':
          description: Closest recipe with ingredient-match details
          content:
            application/json:
              schema:
                type: object
                required:
                  - title
                  - text
                  - match_level
                  - matched_ingredients
                  - approximate_matches
                  - missing_ingredients
                  - unmatched_ingredients
                properties:
                  title:
                    type: string
                  text:
                    type: string
                    description: Recipe title retained for frontend compatibility
                  match_level:
                    type: string
                    enum: [strong, partial, weak]
                  matched_ingredients:
                    type: array
                    items:
                      type: string
                  approximate_matches:
                    type: array
                    items:
                      type: object
                      required: [selected, recipe_ingredient]
                      properties:
                        selected:
                          type: string
                        recipe_ingredient:
                          type: string
                  missing_ingredients:
                    type: array
                    description: Recipe ingredients without an exact selected match
                    items:
                      type: string
                  unmatched_ingredients:
                    type: array
                    items:
                      type: string
        '400':
          description: The query parameter is missing or blank
        '404':
          description: No related recipe was found

  /ingredients:
    get:
      summary: Find the closest ingredient
      parameters:
        - name: query
          in: query
          required: true
          description: Text used to find the closest matching ingredient
          schema:
            type: string
      responses:
        '200':
          description: Closest matching ingredient
          content:
            application/json:
              schema:
                type: string

  /ingredients:
    get:
      summary: Find matching ingredients
      parameters:
        - name: query
          in: query
          required: true
          description: Ingredient name or partial name to search for
          schema:
            type: string
      responses:
        '200':
          description: Up to six ingredient names ranked by relevance; empty if no matches
          content:
            application/json:
              schema:
                type: array
                maxItems: 6
                items:
                  type: string
        '400':
          description: The query parameter is missing or blank

  /random/recipes:
    get:
      summary: Get random recipes
      parameters:
        - name: number
          in: query
          required: true
          description: Number of random recipes to return
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Random recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /random/ingredients:
    get:
      summary: Get random ingredients
      parameters:
        - name: number
          in: query
          required: true
          description: Number of random ingredients to return
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Random ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /random/action-items:
    get:
      summary: Get random action items
      parameters:
        - name: number
          in: query
          required: true
          description: Number of random action items to return
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Random action items
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
